name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src

      - name: Demo pipeline runs end to end and re-import is idempotent
        run: |
          python -m applicant_inbox --db ci.db demo | tee first.txt
          grep -q "30 applications from 6 sources -> 18 candidates" first.txt
          python -m applicant_inbox --db ci.db demo | tee second.txt
          grep -q "30 applications from 6 sources -> 18 candidates" second.txt
          python -m applicant_inbox --db ci.db export --out candidates.csv
          test "$(wc -l < candidates.csv)" -eq 19
        env:
          PYTHONPATH: src
